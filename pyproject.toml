[project]
name = "kaggle-mcp"
version = "0.1.0"
description = "MCP server exposing Kaggle dataset search/download/EDA tools to LLM clients"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "kaggle>=1.6.17,<2",
    "pandas>=2.2.0",
]

[project.scripts]
kaggle-mcp = "kaggle_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_mcp"]
